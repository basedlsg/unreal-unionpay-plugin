version: '3.8'

services:
  # API Gateway
  api-gateway:
    image: kong:3.4-alpine
    container_name: unionpay-gateway
    ports:
      - "8000:8000"  # HTTP
      - "8443:8443"  # HTTPS
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin API HTTPS
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    depends_on:
      - postgres
    networks:
      - unionpay-network

  # Payment Processing Service
  payment-service:
    build: 
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: unionpay-payment
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${PAYMENT_DATABASE_URL}
      - REDIS_URL=${PAYMENT_REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - UNIONPAY_MERCHANT_ID=${UNIONPAY_MERCHANT_ID}
      - UNIONPAY_API_KEY=${UNIONPAY_API_KEY}
      - PPRO_API_KEY=${PPRO_API_KEY}
      - MASTERCARD_API_KEY=${MASTERCARD_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/payment:/app
      - ./logs:/app/logs
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Authentication Service
  auth-service:
    build: 
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: unionpay-auth
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DATABASE_URL=${AUTH_DATABASE_URL}
      - REDIS_URL=${AUTH_REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600}
      - BCRYPT_ROUNDS=12
    depends_on:
      - postgres
      - redis
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Fraud Detection Service
  fraud-detection:
    build: 
      context: ./services/fraud
      dockerfile: Dockerfile
    container_name: unionpay-fraud
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - MODEL_PATH=/models/fraud_detection_model.h5
      - REDIS_URL=${FRAUD_REDIS_URL}
      - DATABASE_URL=${FRAUD_DATABASE_URL}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./models:/models
      - ./services/fraud:/app
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service
  notification-service:
    build: 
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: unionpay-notification
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - redis
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: unionpay-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Kong database
      KONG_DB: ${KONG_PG_DB}
      KONG_USER: ${KONG_PG_USER}
      KONG_PASSWORD: ${KONG_PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unionpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: unionpay-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: unionpay-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - unionpay-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: unionpay-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - unionpay-network

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: unionpay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - unionpay-network

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: unionpay-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - unionpay-network

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: unionpay-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - unionpay-network

  # MinIO for File Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: unionpay-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - unionpay-network

networks:
  unionpay-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  minio_data: